<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Account Agent (AWS)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1b1f24; }
  header { background: #d9730d; color: #fff; padding: 14px 20px; }
  header small { opacity: .8; display: block; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  #log { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; height: 60vh; overflow-y: auto; }
  .msg { margin: 8px 0; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; line-height: 1.4; }
  .user { background: #fdf0e3; margin-left: 15%; }
  .agent { background: #f1f3f5; margin-right: 15%; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; padding: 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 15px; }
  button { padding: 10px 18px; border: 0; border-radius: 6px; background: #d9730d; color: #fff; font-size: 15px; cursor: pointer; }
  .hints button { background: #fff; color: #d9730d; border: 1px solid #d9730d; margin: 4px 4px 0 0; font-size: 13px; padding: 6px 10px; }
</style>
</head>
<body>
<header>Sales Account Agent <small>Strands Agents on AWS &middot; governed by the Apigee AI gateway</small></header>
<main>
  <div id="log"></div>
  <form id="f"><input id="q" autocomplete="off" placeholder="Ask about an account..."><button>Send</button></form>
  <div class="hints">
    <button data-q="Give me an overview of Acme Corp: contacts, open opportunities and cases.">Acme overview (PII allowed)</button>
    <button data-q="Move opportunity 006A000002 to Negotiation.">Update opportunity (allowed)</button>
    <button data-q="What is the status of ServiceNow incident INC0010002?">ServiceNow (not entitled)</button>
    <button data-q="Search the knowledge base for the customer escalation policy.">Knowledge base</button>
  </div>
</main>
<script>
  let sessionId = null;
  const log = document.getElementById('log');
  function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  async function send(text) {
    add(text, 'user');
    const r = await fetch('chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }) });
    const data = await r.json();
    sessionId = data.session_id;
    add(data.reply, 'agent');
  }
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    const q = document.getElementById('q');
    if (q.value.trim()) { send(q.value.trim()); q.value = ''; }
  };
  document.querySelectorAll('.hints button').forEach((b) => b.onclick = () => send(b.dataset.q));
</script>
</body>
</html>
